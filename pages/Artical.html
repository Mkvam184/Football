<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Đang tải bài viết... - Tin Tức Bóng Đá</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter font chuẩn giao diện báo chí) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#04170A] text-gray-100 min-h-screen flex flex-col justify-between selection:bg-[#FF4500] selection:text-white">

    <!-- HEADER TRANG BÁO -->
    <header class="sticky top-0 z-50 bg-[#071F0E]/90 backdrop-blur-md border-b border-[#166534]/50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <button id="btn-back" class="flex items-center gap-2 text-white hover:text-[#FF4500] transition-colors font-bold text-sm cursor-pointer border-none bg-transparent">
                <span>← Quay lại</span>
            </button>
            <div class="font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-white via-emerald-200 to-[#FF4500]">
                FOOTBALL NEWS
            </div>
            <button id="btn-share" class="px-3 py-1.5 bg-[#166534]/40 hover:bg-[#166534] text-xs font-semibold rounded-lg text-emerald-300 border border-[#166534] transition-all flex items-center gap-1.5">
                🔗 Chia sẻ
            </button>
        </div>
    </header>

    <!-- NỘI DUNG BÀI BÁO CHÍNH -->
    <main class="max-w-3xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Thẻ Danh Mục & Ngày Đăng -->
        <div class="flex items-center justify-between gap-4 mb-4 text-xs">
            <span id="news-category" class="bg-[#FF4500] text-white font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-lg">
                DANH MỤC
            </span>
            <span id="news-date" class="text-gray-400 font-medium">
                ⏱️ Đang cập nhật...
            </span>
        </div>

        <!-- Tiêu Đề Bài Báo (Heading 1) -->
        <h1 id="news-title" class="text-2xl sm:text-4xl font-black text-white leading-tight sm:leading-snug mb-6">
            Đang tải tiêu đề bài viết...
        </h1>

        <!-- Ảnh Banner Bài Viết -->
        <div class="mb-8 rounded-2xl overflow-hidden border border-[#166534]/40 shadow-2xl bg-[#051C0C]">
            <img id="news-image" src="" alt="Banner bài viết" class="w-full h-auto max-h-[450px] object-cover">
            <p id="news-image-caption" class="text-[11px] text-gray-400 p-2.5 bg-[#020D06] italic text-center border-t border-[#166534]/20">
                Hình ảnh minh họa cho bài viết
            </p>
        </div>

        <!-- Thanh Tách Biệt -->
        <div class="h-px bg-gradient-to-r from-transparent via-[#166534] to-transparent w-full mb-8"></div>

        <!-- Thân Bài Báo (Nội dung chi tiết) -->
        <article id="news-content" class="text-gray-200 text-base sm:text-lg leading-relaxed space-y-6 font-normal break-words">
            <!-- Nội dung sẽ được render bằng JS ở đây -->
        </article>
    </main>

    <!-- FOOTER TRANG BÁO -->
    <footer class="bg-[#020D06] border-t border-[#166534]/30 py-8 mt-12">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs text-gray-500">
            <p>© 2026 Football News Network. Tất cả quyền được bảo lưu.</p>
        </div>
    </footer>

    <!-- FILE JAVASCRIPT ĐỌC DỮ LIỆU -->
    <script type="module" src="../js/Artical.js"></script>
</body>
</html>
